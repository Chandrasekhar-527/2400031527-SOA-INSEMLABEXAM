spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=tourist-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://TOURIST-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/tourists,/tourists/**